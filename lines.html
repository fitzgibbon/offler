<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lines &middot; offler &middot; WebGL2 / WebGPU</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: #05060a; color: #c9d1de;
    font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* The canvas is the window. The chrome floats over it, so resizing changes
     the drawing buffer rather than squashing a fixed-size one. */
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  header, footer { position: fixed; left: 0; right: 0; z-index: 1; }
  header {
    top: 0; padding: 1rem 1.4rem 1.1rem;
    background: linear-gradient(#05060aee, #05060a00);
  }
  h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  h1 span { color: #6d7688; font-weight: 400; }
  h1 a { color: #9fb0c8; text-decoration: none; }
  p { margin: 0.3rem 0 0; color: #7d8798; max-width: 66ch; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em;
    color: #9fb0c8; background: #11141c; padding: 0.08em 0.36em; border-radius: 3px;
  }
  footer {
    bottom: 0; padding: 1.1rem 1.4rem; color: #7d8798;
    background: linear-gradient(#05060a00, #05060aee);
    display: flex; gap: 1.1rem; align-items: center; flex-wrap: wrap;
  }
  button {
    font: inherit; font-weight: 500; color: #dfe6f2;
    background: #1b2230; border: 1px solid #2b3446; border-radius: 6px;
    padding: 0.4rem 0.85rem; cursor: pointer;
  }
  button:hover { background: #232c3d; border-color: #3a465c; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .pill { border: 1px solid #2b3446; border-radius: 999px; padding: 0.15rem 0.7rem; color: #9fb0c8; }
  #count-label, #fps { min-width: 6ch; font-variant-numeric: tabular-nums; }
  #note { color: #c8a26a; }
  #error {
    display: none; position: fixed; z-index: 2; left: 1.4rem; right: 1.4rem; top: 40%; padding: 0.85rem 1rem;
    border: 1px solid #5a2230; background: #1c0f14; color: #e08a9b;
    border-radius: 6px; white-space: pre-wrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.86em;
  }
</style>
</head>
<body>
<header>
  <h1><a href="index.html">offler</a> / Lines <span>&mdash; Idris 2 compiled to JavaScript</span></h1>
  <p>A spinning wireframe globe, an animated Lissajous ribbon with glowing markers riding it, and a ground grid &mdash; all one blended line-list draw over ordinary lit meshes, rebuilt on the CPU every frame.</p>
</header>

<canvas id="gl"></canvas>

<footer>
  <button id="flip">Switch renderer</button>
  <span class="pill" id="backend">starting&hellip;</span>
  <span id="count-label"></span>
  <span id="fps"></span>
  <span id="stats"></span>
  <span id="note"></span>
</footer>

<pre id="error"></pre>

<!-- The only hand-written JavaScript: choosing which compiled bundle to
     load, and saying so when it is not there. Each backend is a separate
     Idris compilation, so the footer button switches backends by navigating
     here with ?r=webgpu. Everything past this point is Idris. -->
<script>
  var s = document.createElement('script');
  s.src = new URLSearchParams(location.search).get('r') === 'webgpu'
        ? 'build/exec/lines-gpu.js' : 'build/exec/lines-gl2.js';
  s.onerror = function () {
    var e = document.getElementById('error');
    e.textContent = 'Could not load ' + s.src + '\n\nBuild it with:  make web';
    e.style.display = 'block';
  };
  document.body.appendChild(s);
</script>
</body>
</html>
