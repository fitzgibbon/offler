# Every push and pull request type-checks the library, runs the checks and
# assembles the example site; on main, a green build publishes that site to
# GitHub Pages. The two are one job on purpose -- the checks and the bundles
# share Idris's build/ttc, so doing both in sequence costs less than doing
# them in parallel, and nothing reaches Pages that the checks have rejected.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older run's deployment moot, so let it cancel one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The `ci` devShell rather than the default one: Idris and Node, not
      # the native backend's 3 GiB of Vulkan, SDL and headless X, none of
      # which `make lib`, `make check` or `make site` touches.
      - uses: cachix/install-nix-action@v31
      - name: the library builds
        run: nix develop .#ci --command make lib
      - name: the programs that must not compile still do not
        run: nix develop .#ci --command make check
      - name: the pages and their bundles
        run: nix develop .#ci --command make site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
